workers_dev = false
routes = [
  { pattern = "api.afuchat.com/v1/ads/*", zone_name = "afuchat.com" },
  { pattern = "cdn.afuchat.com/ads/*", zone_name = "afuchat.com" }
]

[[r2_buckets]]
binding = "ADS_ASSETS"
