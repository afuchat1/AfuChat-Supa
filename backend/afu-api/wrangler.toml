environment = "production"

[[services]]
binding = "AFUCHAT_API"
service = "afuchat-api"
environment = "production"

[[services]]
binding = "AFUCLOUD_API"
service = "afucloud-api"
environment = "production"

[[services]]
binding = "AFUAI_API"
service = "afuai-api"
environment = "production"

[[services]]
binding = "AFUADS_API"
service = "afuads-api"
environment = "production"

[[services]]
binding = "AFUMAIL_API"
service = "afumail-api"
environment = "production"

[observability]
enabled = true
