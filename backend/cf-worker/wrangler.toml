# Canonical production API Worker. All AfuCloud projects use this Worker.
# Do not create additional production Workers; add routes here instead.
name = "afucloud-api"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
account_id = "42e79186125e8ff83e51f15816e074de"

# ── Routes ───────────────────────────────────────────────────────────────────
routes = [
  { pattern = "api.afuchat.com", zone_name = "afuchat.com" },
  { pattern = "api.afuchat.com/*", zone_name = "afuchat.com" }
]

# ── R2 Bucket binding ─────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "afucloud-images"
# preview_bucket_name = "afucloud-images-dev"  # uncomment for local dev

# ── Vars (non-secret) ─────────────────────────────────────────────────────────
[vars]
SUPABASE_URL = "https://poijhidfekwfthyksatp.supabase.co"
SUPABASE_PROJECT_ID = "poijhidfekwfthyksatp"
SUPABASE_DB_SCHEMA = "afucloud"
# AfuChat's active Supabase auth project. The anon key is public client
# configuration and is only used to validate a bearer session at /auth/v1/user.
AFUCHAT_SUPABASE_URL = "https://poijhidfekwfthyksatp.supabase.co"
AFUCHAT_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvaWpoaWRmZWt3ZnRoeWtzYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MDcwNDksImV4cCI6MjEwNTQ4MzA0OX0.sEcHL19jvnPkFDUmYRazp5ntwFyJd_mE4Nh--lbaVNE"
R2_BUCKET_NAME = "afucloud-images"
CLOUDFLARE_ACCOUNT_ID = "42e79186125e8ff83e51f15816e074de"
AFU_CDN_TARGET = "img.afuchat.com"
R2_PUBLIC_URL = "https://img.afuchat.com"
CLOUDFLARE_R2_ACCESS_KEY_ID = "40916680c4892042d4ce49396ef62819"
NODE_ENV = "production"

# ── Scheduled jobs ─────────────────────────────────────────────────────────────
# Expired stories and their active R2 objects are removed by the Worker itself.
[triggers]
crons = ["*/15 * * * *"]

# ── Secrets (set via: wrangler secret put SECRET_NAME) ────────────────────────
# SUPABASE_SERVICE_KEY      — Supabase service role key
# JWT_SECRET                — JWT signing secret
# CLOUDFLARE_R2_SECRET_ACCESS_KEY  — R2 S3-compatible secret key

# ── Dev environment overrides ─────────────────────────────────────────────────
[env.dev]
vars = { NODE_ENV = "development" }
